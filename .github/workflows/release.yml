# main の Qpen.ps1 が変わったら、中の $Version を読み取り、まだリリースされていない版ならリリースを作る。
# タグは必ず Qpen.ps1 のバージョンから作るので、タグとファイルのバージョンがずれることはない。
# ファイルが壊れている（BOM がない・構文エラー・バージョンが読めない）ときはリリースしない。
#
# 注意: run に書いた処理は BOM なしのファイルとして実行されるため、Windows PowerShell 5.1 では
# 日本語が文字化けする。run には英数字だけを書き、日本語を含む処理は .github/scripts の BOM 付きファイルに置く。
name: リリース

on:
  push:
    branches: [main]
    paths:
      - Qpen.ps1
      - .github/workflows/release.yml
      - .github/scripts/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Qpen と同じ Windows PowerShell 5.1 で確認する
      - name: Qpen.ps1 を検証してバージョンを読み取る
        id: check
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .github/scripts/check-version.ps1

      - name: まだリリースされていなければリリースを作る
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .github/scripts/create-release.ps1
